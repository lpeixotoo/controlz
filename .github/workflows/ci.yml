# CI gate (KB Tooling, D13): runs scripts/check.sh, the same gate agents run
# locally. Actions are pinned by full commit SHA; bumps are manual (D19).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Uses [profile.ci] in .config/nextest.toml (no fail-fast, no retries).
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No arguments: rustup reads rust-toolchain.toml (channel + components).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false

      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest@0.9.152,cargo-deny@0.22.1,cargo-machete@0.10.1

      - name: Quality gate
        run: scripts/check.sh
