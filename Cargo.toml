[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Shared dependency pins. Members opt in with `name = { workspace = true }`.
[workspace.dependencies]
uniffi = "0.33.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.3"
tracing = "0.1.44"
# CLI only (D9): keep out of controlz_core.
clap = { version = "4.6.10", features = ["derive"] }
security-framework = "3.7.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[profile.release]
lto = true
strip = true
