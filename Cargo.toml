[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Shared dependency pins. Members opt in with `name = { workspace = true }`.
[workspace.dependencies]
uniffi = "0.33.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.3"
tracing = "0.1.44"
# AC route (D20): legacy TLS 1.2 + X.509 on a static OpenSSL 3.6 (openssl-src 300.x).
openssl = { version = "0.10.82", features = ["vendored"] }
openssl-sys = "0.9.118"
tokio-openssl = "0.6.5"
# CLI only (D9): keep out of controlz_core.
clap = { version = "4.6.10", features = ["derive"] }
security-framework = "3.7.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
# Dev only: snapshot tests.
insta = "1.49"

# Lint policy (KB Tooling, D13). Members opt in with `[lints] workspace = true`.
# Explicit allows of noisy pedantic lints go on their own line with a comment.
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
strip = true
